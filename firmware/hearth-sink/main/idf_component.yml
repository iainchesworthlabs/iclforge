# What this firmware needs from the component registry, on top of what ESP-IDF
# itself ships, and the iclforge component, which it takes from this checkout.
dependencies:
  # The component of firmware/esp-idf/iclforge: the player, the control surface and the library
  # under them. A path into the checkout, since the sink is built from one; a project of anybody's
  # takes the registry's (tools/packaging/pack_esp_component.py packs it) or EXTRA_COMPONENT_DIRS.
  iclforge:
    override_path: "../../esp-idf/iclforge"
  # mDNS, so a server finds this sink by name rather than by address
  # (main/discovery.cpp). Espressif moved it out of esp-idf at v5.0, so it is
  # a managed dependency rather than a component in the IDF tree.
  espressif/mdns: "^1.8.0"
  # The ESP32-P4 (and the ESP32-H2) have no Wi-Fi radio of their own; these
  # two answer the same esp_wifi_*/esp_netif_* calls main/net/wifi/network.cpp
  # already makes, over esp_hosted/SDIO to a companion chip (an onboard
  # ESP32-C6 on the board this was brought up on) that does. Confirmed
  # end to end on that board 2026-09-23 by a standalone connectivity test
  # before this manifest carried them: SDIO up, the co-processor identified,
  # a real AP joined, a DHCP lease. Versions match ESP-IDF v6.1's own
  # examples/wifi/getting_started/station, the reference this was modelled
  # on. Unused, and not pulled in at all, on every other target this example
  # already builds for - see examples/wifi/README.md's "Two-Chip Solution".
  espressif/esp_wifi_remote:
    version: ">=0.10,<2.0"
    rules:
      - if: "target in [esp32p4, esp32h2]"
  espressif/esp_hosted:
    version: "~2"
    rules:
      - if: "target in [esp32p4, esp32h2]"
  # The panel (planning/karaoke-p4x-panel.md): LVGL draws the lyrics, whether on a MIPI DSI panel
  # (the 7-inch 1024 by 600 EK79007 panel of Espressif's ESP32-P4-Function-EV-Board, with a GT911
  # touch controller) or into a frame buffer with no panel behind it, for a board that has none.
  # Only the ESP32-P4 has the DSI host and the 2D engines, so no other target pulls them in. They
  # are compiled for every P4 image, and linked only where main/panel/lvgl is the panel the
  # build picked (CONFIG_ICLFORGE_EXAMPLE_PANEL_*). 9.5 and not the newest: 9.6.0 is weeks old.
  lvgl/lvgl:
    version: "~9.5.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lcd_ek79007:
    version: "^2.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lcd_touch_gt911:
    version: ">=1.1"
    rules:
      - if: "target in [esp32p4]"
