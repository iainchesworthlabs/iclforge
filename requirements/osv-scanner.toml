# Advisories OSV-Scanner reports for a file in THIS directory that nothing in this repository can
# fix today. OSV-Scanner reads an osv-scanner.toml only for manifests in the same directory (it does
# not look in parents), which is why this file is here and not at the repository root.
#
# An entry is a decision to wait, not a judgement that the advisory is harmless: when the date
# passes the alert comes back and the entry is renewed with a fresh check or removed. Do not add an
# entry for something a pin bump fixes. Checked 2026-10-10.

# requirements-esphome.txt: starlette 0.52.1.
# starlette comes in through esphome -> platformio. esphome 2026.9.1 (the newest) pins
# platformio==6.1.19 exactly, which caps starlette<0.53, and 0.52.1 is the newest release under that
# cap. PlatformIO 6.2.0 allows starlette<2, but esphome has not adopted it, so the resolver rejects
# any starlette bump (the longer account is in requirements-esphome.in). The file feeds
# `esphome config` in esp-component.yml and nothing starts a web server from it.
# Renew or remove when esphome moves to platformio >= 6.2.0. Each advisory is listed under both
# identifiers the scanner prints for it (PYSEC and GHSA).
[[IgnoredVulns]]
