ignoreUntil = 2027-01-08
reason = "GHSA-82w8-qh3p-5jfq / CVE-2026-54283: starlette 0.52.1 is the newest esphome 2026.9.1's platformio==6.1.19 allows; esphome config never serves HTTP"

