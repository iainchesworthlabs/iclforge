# requirements-esphome.txt: pillow 12.3.0.
# Pillow 13.0.0 fixes all nine, but every esphome release up to and including 2026.10.0 (the
# newest) pins pillow==12.3.0 exactly in its own metadata, so the resolver rejects any bump in this
# lock (requirements-ffmpeg-validate.txt and tools/sendspin/requirements.txt are bumped to 13.0.0;
# they have no such cap). `esphome config` on firmware/esphome/tests/iclforge-test.yaml, the only
# thing this lock runs, loads no image, font or display component, so Pillow never decodes a file;
# the YAML is this repository's own. Renew or remove when esphome moves its pillow pin to >= 13.
# Dated short on purpose: esphome ships monthly. Each advisory is listed under both identifiers.

[[IgnoredVulns]]
id = "CVE-2026-112395"
ignoreUntil = 2026-12-01
