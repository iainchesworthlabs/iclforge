# --- requirements/requirements-esphome.txt: starlette 0.52.1 -------------------------------------
# starlette comes in through esphome -> platformio. esphome 2026.9.1 (the newest) pins
# platformio==6.1.19 exactly, which caps starlette<0.53, and 0.52.1 is the newest release under
# that cap. platformio 6.2.0 allows starlette<2, but esphome has not adopted it, so the resolver
# rejects any starlette bump (the longer account is in requirements-esphome.in). The file feeds
# `esphome config` in esp-component.yml and nothing starts a web server from it.
# Renew or remove when esphome moves to platformio >= 6.2.0.
