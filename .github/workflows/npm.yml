# iclforge-wasm-decoder, the browser streaming decoder package (WASM streaming decoder package, bindings/js/) - separate
# from _build.yml/ci.yml's C++ matrix and from build-wasm's Emscripten build, neither of which
# this needs: bindings/js/'s own build (tsc) and test suite (node:test - the fMP4 box walker against a
# committed fixture, the ring buffer, the MediaSource shim) are pure TypeScript/JavaScript with
# no WASM binary dependency. build-wasm (in _build.yml) is the leg that builds bindings/js/ ALONGSIDE the
# actual Emscripten output and exercises the whole demo end-to-end in a browser; this workflow
# only needs to know that the package itself builds and its own unit tests pass.
#
# The build job runs continuously (every push/PR touching bindings/js/**, called from ci.yml's `npm` lane
# since the CI lane partitions split - docs/ci-lanes.md) and always packs the tarball as an
# artifact - "buildable and testable" is checked the same way wheels.yml's own build job checks
# the Python side continuously. Publishing to npm is a second job, gated on a v* tag push - see
# docs/releasing.md's "Publishing to npm" for how it's provisioned (not yet - unlike PyPI, this
# needs a one-time manual npmjs.com/GitHub setup that has not happened).
name: npm Package

on:
  # CI lane partitions (docs/ci-lanes.md): PR/main-push validation now comes
  # from ci.yml's own `npm` job-call, gated on the `npm` lane, not from this
  # workflow's own trigger - see wheels.yml's identical comment for why the
  # release-publish path (tags, no branches, unchanged paths behaviour) is
  # the only direct trigger left and why it cannot overlap with ci.yml's call.
  push:
    paths:
      - "bindings/js/**"
      - ".github/workflows/npm.yml"
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:

# Only the newest main commit's run waits for the GitHub-hosted runners on a
# push to main - see wheels.yml's identical block for how and why.
concurrency:
  group: npm-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' && '-newest' || format('-{0}', github.sha)) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache anywhere in this workflow: it publishes (the job below, on a v* tag),
      # and a cache that a pull request's run could have written is what zizmor's cache-poisoning
      # audit flags there. `npm ci` from the lockfile is a few seconds; the other workflows keep
      # their caches. package-manager-cache: false turns off setup-node's automatic npm cache too.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install, build, test
        working-directory: bindings/js
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm test

      # Uploaded purely so a PR's actual packed output is inspectable from the Actions run -
      # `npm pack` runs the same "files" allowlist `npm publish` would, catching an accidentally-
      # missing dist/ entry before it ever reaches a real publish.
      - name: Pack
        working-directory: bindings/js
        run: npm pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: bindings/js/*.tgz
          if-no-files-found: error

  # Publishes via npm trusted publishing (OIDC) against the `npm` GitHub environment - neither is
  # provisioned yet; see docs/releasing.md's "Publishing to npm". Gated on a v* tag push, same as
  # wheels.yml's own PyPI job; the build job above runs on every push regardless.
  publish:
    name: Publish to npm
    needs: build
    # Publishing is deliberately NOT armed on tag push yet. iclforge-wasm-decoder
    # has never been published to npm, and trusted publishing is not configured
    # for it, so a v* tag would create a brand-new PUBLIC package as a side effect
    # of cutting a release - effectively irreversible, since npm's unpublish window
    # is narrow and the name stays reserved either way. Restricted to an explicit
    # manual dispatch until that setup is done and verified; then drop the
    # event_name clause to restore publish-on-tag.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # npm trusted publishing needs npm CLI >= 11.5.1. The npm that setup-node's Node 24
      # bundles is far past that, so this step does not install one (an `npm install -g`
      # is an install outside any lockfile, which is what zizmor's adhoc-packages and
      # Scorecard's pinned-dependencies both report). It checks the bundled one instead,
      # and fails the run before anything is published if a Node release ever ships older.
      - name: Require npm >= 11.5.1 (trusted publishing)
        run: |
          set -euo pipefail
          have="$(npm --version)"
          echo "npm ${have}"
          oldest="$({ echo 11.5.1; echo "${have}"; } | sort -V | head -n 1)"
          if [ "${oldest}" != "11.5.1" ]; then
            echo "::error::npm ${have} is older than 11.5.1, which npm trusted publishing needs."
            exit 1
          fi

      - name: Install
        working-directory: bindings/js
        run: npm ci

      # After npm ci, not before: package-lock.json still says 0.0.0-dev at
      # that point, matching package.json's own tree-committed placeholder -
      # bumping the version first risks npm ci rejecting the now-mismatched
      # lockfile.
      - name: Stamp the release version
        working-directory: bindings/js
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build
        working-directory: bindings/js
        run: npm run build

      - name: Publish to npm
        working-directory: bindings/js
        run: npm publish
