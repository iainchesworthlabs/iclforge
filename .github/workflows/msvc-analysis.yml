# Windows/MSVC static analysis (/analyze) over the windows-msvc build, run
# nightly against main - the Windows counterpart of codeql.yml's Linux
# GCC-based CodeQL scan. CodeQL only ever builds the Linux/GCC leg (see
# codeql.yml's header) and never sees the windows-msvc build, which ships
# with the GUI on by default (CMakePresets.json's windows-msvc preset); the
# defects /analyze catches that gcc-based CodeQL cannot - SEH, ATL/COM
# misuse, other MSVC-specific patterns - would otherwise go unseen. Modelled
# on aqualink-automate's CodeScanning_MSVCCodeAnalysis job in
# automated-codescanning.yml.
#
# Trigger: one schedule at 02:23 UTC, plus workflow_dispatch. No push,
# pull_request or merge_group trigger: code-analysis engines in this repo run
# once a night on refs/heads/main (the ref that refreshes main's
# Security > Code scanning baseline), and nothing gates on this workflow. A
# run holds a self-hosted Windows slot for about 35 minutes when the fleet is
# online, so it runs once a night rather than per PR and per merge-queue
# entry. docs/ci-self-hosted-runners.md "Nightly analysis window" has the
# cron table this slot sits in.
#
# Surfacing: upload-sarif does not fail on findings and nothing reliably
# notifies anyone about a new alert on the default branch, so the `surface` job
# at the bottom queries the code-scanning API for PREfast alerts created
# since the previous nightly and, on any (or on an analysis failure), opens
# or refreshes the `nightly-analysis` issue through
# .github/actions/report-nightly-failure.
name: MSVC Code Analysis

on:
  schedule:
    # Nightly, six minutes after codeql.yml's cron so the two
    # toolchain-versions calls do not land on the control-plane runner in the
    # same minute. See docs/ci-self-hosted-runners.md "Nightly analysis window".
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  # One nightly at a time; a manual dispatch queues behind a running nightly
  # rather than cancelling it (an analysis that never finishes uploads nothing).
  # The group names the ref, so a trial dispatch from a branch has a queue of
  # its own and neither waits for nor delays main's nightly.
  group: msvc-analysis-nightly-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Single source of truth for the Qt/vcpkg pins below - see
  # docs/ci-self-hosted-runners.md and _toolchain-versions.yml's own header.
  toolchain-versions:
    uses: ./.github/workflows/_toolchain-versions.yml
    permissions:
      contents: read
      actions: read
    secrets:
      ORG_RUNNERS_TOKEN: ${{ secrets.ORG_RUNNERS_TOKEN }}

  # Same self-hosted/GitHub-hosted fan-out _build.yml's own Windows legs get
  # (see docs/ci-self-hosted-runners.md), via the shared decide-runner
  # composite action rather than _build.yml's own check-runners job - this
  # workflow is triggered independently of ci.yml/_build.yml, so it has no
  # access to that job's outputs. At 02:23 the Windows fleet is normally
  # idle, so `auto` lands on self-hosted whenever a runner is online.
  check-runner:
    name: Check self-hosted runner availability
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      runner: ${{ steps.decide.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: decide
        uses: ./.github/actions/decide-runner
        with:
          os-label: Windows
          hosted-json: '["windows-latest"]'
          mode: ${{ vars.RUNNER_WINDOWS_MODE || 'auto' }}
          org-token: ${{ secrets.ORG_RUNNERS_TOKEN }}

  analyze:
    name: MSVC Code Analysis
    needs: [toolchain-versions, check-runner]
    # Always true on schedule and workflow_dispatch, the only triggers today.
    # Kept for the day a filtered pull_request trigger comes back for
    # external-contributor PRs: it is the belt-and-braces line (same as
    # _build.yml's build job) that keeps a fork's code off a self-hosted
    # runner even if check-runner's own fork-PR branch ever developed a gap.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    # 35.1 min median / 36.1 max measured on the fleet (2026-09-04); there
    # was no bound before. A hung run would otherwise hold a Windows fleet
    # slot into aqualink-automate's 04:00 window. A hosted windows-latest
    # run (the fallback when no Windows runner is online) took 73.7 min on
    # 2026-10-09 and a dispatched one was cancelled at the old 90-minute
    # bound on 2026-10-10 with a busy queue, so the bound is 150: still a
    # hang is caught, and an ordinary slow run is not reported as a failure.
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cl.exe, INCLUDE and LIB are not on the default PATH; Ninja does not
      # set them up itself (unlike MSBuild) - same step _build.yml uses for
      # every MSVC leg.
      - name: Setup MSVC environment
        uses: ./.github/actions/setup-msvc-env

      # install-qt-action v4.4.0's own bootstrap check shells out to a bare
      # python before its internal setup-python sub-step ever runs, and this
      # fleet's self-hosted Windows runners never put one on PATH - see
      # _ci-windows.yml's identical fix (same v4.4.0 change) for the full
      # story; this job can land on that same fleet (its own decider above).
      # The same embeddable-zip step that leg uses, not an installer: choco's
      # python package only adds a versioned python3.14.exe shim and puts
      # C:\Python314 on the machine PATH, which a running job never re-reads,
      # so install-qt-action still found no bare `python` - this job's first
      # nightly after v4.4.0's bump (#952) failed on exactly that.
      - name: Setup Python (for install-qt-action)
        uses: ./.github/actions/setup-embeddable-python

      # windows-msvc defaults ICLFORGE_BUILD_GUI to ON (CMakePresets.json),
      # and Qt is a prebuilt dependency (cmake/FindQt6.cmake), never a vcpkg
      # port - see _build.yml's own precedent for this exact install step.
      - name: Install Qt (prebuilt)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ needs.toolchain-versions.outputs.qt_version }}
          aqtsource: ${{ needs.toolchain-versions.outputs.aqt_source }}
          modules: qttasktree
          cache: true
          setup-python: false

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}

      # QT_ROOT_DIR (set by install-qt-action) is a runner-specific path
      # cmake/FindQt6.cmake's local search roots do not cover - same override
      # _build.yml applies for every Windows leg.
      - name: Configure
        shell: bash
        run: cmake --preset config-windows-msvc -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        shell: bash
        run: cmake --build --preset build-windows-msvc -- -k 0

      # ignoredPaths below takes whole directories, and the tests used to be one: the root tests/.
      # The monorepo move put each beside the code it tests (libs/ac3/tests, apps/hearth/engine/
      # tests, ...), so that one path matched nothing and the first analysis to finish afterwards
      # reported 198 findings, about 160 of them in test code. The directories are read from the
      # tree, so a library's new tests/ is left out without anyone remembering to add it here. An
      # empty list fails the job: an exclusion that matches nothing is how this went unseen.
      - name: List the test directories
        id: test-dirs
        shell: bash
        run: |
          set -euo pipefail
          paths=
          while IFS= read -r file; do
            case "$file" in
              tests/*|*/tests/*) paths="${paths:+$paths;}${file%/*}" ;;
            esac
          done < <(git ls-files -- '*CMakeLists.txt')
          if [ -z "$paths" ]; then
            echo "::error::no tests/ directory holds a CMakeLists.txt, so ignoredPaths would match nothing"
            exit 1
          fi
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          echo "Leaving out of the analysis:"
          echo "$paths" | tr ';' '\n'

      # The repo-local rule set is NativeRecommendedRules minus the rules
      # whose entire alert history here is dismissed false positives - see
      # .github/msvc-analysis.ruleset's own header for the per-rule
      # reasoning and where each displaced defect class is still covered.
      - name: Run MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@24c285ab36952c9e9182f4b78dfafbac38a7e5ee # v0.1.1
        id: run-analysis
        with:
          cmakeBuildDirectory: ${{ github.workspace }}/build/config-windows-msvc
          buildConfiguration: Release
          ruleset: .github/msvc-analysis.ruleset
          ignoredPaths: ${{ steps.test-dirs.outputs.paths }}

      # Qt's tools write C++ into the build directory while it builds (qmlcachegen's
      # .rcc/qmlcache/*_qml.cpp, moc's mocs_compilation.cpp); the analyzer compiles it with the
      # target it belongs to, where ignoredPaths cannot leave it out, and it is not ours to fix:
      # alerts 9750 and 9751 are C6262 on two generated Main_qml.cpp. So its results are left
      # out of the upload, and an alert whose result stops arriving closes by itself. Results
      # in project source are untouched. See tools/ci/sarif_drop_generated.py.
      - name: Leave results in generated sources out of the upload
        shell: bash
        env:
          SARIF: ${{ steps.run-analysis.outputs.sarif }}
        run: python tools/ci/sarif_drop_generated.py "$SARIF" build/config-windows-msvc

      # No explicit category: the SARIF's own tool name (PREfast) is what the
      # alert history is keyed by, and it has been since the first upload.
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.run-analysis.outputs.sarif }}

      # Saved even when a step above failed, so the packages vcpkg had already
      # built survive for the next attempt (actions/cache's own post-job save
      # runs only on success). continue-on-error: a cache that cannot be saved
      # must never be what fails the job. See .github/actions/save-vcpkg-cache.
      - name: Save vcpkg caches
        if: always()
        continue-on-error: true
        uses: ./.github/actions/save-vcpkg-cache

  # Same shape as codeql.yml's surface job, for the PREfast tool name:
  # upload-sarif never fails on findings and GitHub does not notify on new
  # default-branch alerts, so this job asks the code-scanning API for PREfast
  # alerts on refs/heads/main created inside the last nightly window and
  # fails if there are any; that failure, or analyze failing, is handed to
  # the shared report-nightly-failure action, which opens (or comments on)
  # one `nightly-analysis` issue for this engine. `!cancelled()` rather than
  # `always()`: an analyze failure is still reported rather than skipped
  # past, but a run someone cancelled by hand does not open an issue over
  # it. upload-sarif keeps its default wait-for-processing: true, so the
  # alerts exist by the time this runs. Pinned to ubuntu-latest because this
  # file's check-runner is (this workflow does not read CONTROL_RUNNER_JSON);
  # the job is seconds long and needs only gh and GNU date, so it takes
  # nothing from the fleet. The query names the ref this run analysed:
  # refs/heads/main on the schedule, which is the nightly as it always was,
  # and the dispatched branch on a trial run, so a branch shows what the next
  # nightly will see (an alert keeps its creation time across refs, so one
  # main already holds is not new on the branch either). The issue is opened
  # or commented on only for main.
  surface:
    name: Surface findings
    needs: analyze
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
      issues: write
    env:
      TOOL: PREfast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail on code-scanning alerts created since the last nightly
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSED_REF: ${{ github.ref }}
          # Nightly cadence plus an hour of slack for a late-starting run.
          # The 25 h window overlaps the previous run by about an hour, so an
          # alert from night N is listed again on night N+1 while it stays
          # open - a second comment on the same issue, not a second finding.
          WINDOW_HOURS: "25"
        shell: bash
        run: |
          set -euo pipefail
          since="$(date -u -d "-${WINDOW_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)"
          # The alerts endpoint has no created-since filter: ask for the
          # newest first and filter client-side. One page of 100 bounds the
          # call; more than 100 new alerts in one night would be truncated,
          # which is acceptable for a "did anything new appear" signal.
          gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=${ANALYSED_REF}&tool_name=${TOOL}&sort=created&direction=desc&per_page=100" \
            --jq ".[] | select(.created_at > \"${since}\") | \"\\(.number)\\t\\(.rule.id)\\t\\(.most_recent_instance.location.path):\\(.most_recent_instance.location.start_line)\\t\\(.html_url)\"" \
            > new-alerts.tsv
          count="$(wc -l < new-alerts.tsv | tr -d '[:space:]')"
          if [ "${count}" -gt 0 ]; then
            echo "::error::${count} new ${TOOL} alert(s) on ${ANALYSED_REF} since ${since}:"
            cat new-alerts.tsv
            exit 1
          fi
          echo "No new ${TOOL} alerts on ${ANALYSED_REF} since ${since}."

      - uses: ./.github/actions/report-nightly-failure
        if: (failure() || needs.analyze.result != 'success') && github.ref == 'refs/heads/main'
        with:
          engine: ${{ env.TOOL }}
          detail: "New PREfast alerts on main since the previous nightly, or the analysis itself failed. See the run log, then Security > Code scanning filtered to refs/heads/main and tool PREfast."
