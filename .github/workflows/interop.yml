# Third-party decode interop against a corpus this project did not produce.
#
# Every other gate in this repository decodes something iclforge (or, in the
# gold-reference gate's newer checks, FFmpeg and Dolby's Encoding Engine driven
# BY iclforge) encoded. tools/checks/verify_fate_interop.py decodes streams
# nobody here commissioned: pinned excerpts of commercially mastered programme
# material from FFmpeg's FATE sample archive, encoded years ago by whatever
# encoder the mastering house used. See that file's own header for what each
# sample exercises, why FATE stands in for a conformance suite that does not
# publicly exist, and why the samples are fetched rather than vendored.
#
# Scheduled rather than per-commit because it is the widest, slowest and least
# self-contained of the interop checks: it reaches the network, and the
# per-commit half of the same question - the six committed
# testdata/external-baseline bitstreams - already runs on every
# gold-reference leg of _build.yml, on every push and pull request, with no
# network access at all.
#
# The pull_request trigger covers the harness's own files - so a change to the
# pinned corpus, the floors, or the comparison tool is proved before it lands
# rather than discovered by the next night's run - AND the decode path itself.
#
# That second half was added after a decoder defect sat on main for ten days
# (PR #508). The reasoning it replaces was that a decoder change is already
# covered per-commit by testdata/external-baseline, and for the streams in
# that corpus it is. But every leg in it is a plain elementary stream - stereo
# or 5.1, AC-3 or E-AC-3, generated from this repository's own source material
# - so the substream layer had no per-commit coverage at all: no dependent
# substream, no A/52 §E2.3.1.2 legacy core, no programme selection.
# the_great_wall_7.1.eac3 below is the only stream in either corpus that
# exercises it, and it cannot be moved to the per-commit side: the FATE samples
# are copyrighted film excerpts that are deliberately never committed (see
# verify_fate_interop.py), and this tree cannot encode a legacy core to stand in
# for one - it cannot even encode that fixture's 3/1 acmod.
#
# The paths stay narrow deliberately. The vector kernels and the transforms can
# change decoded output too, but proving that is the gold-reference gate's job,
# which runs per-commit with no network at all. This one is here for the
# bitstream-shape questions only real third-party encoder output can ask.
#
# Toolchain is ffmpeg-validate's, not a fuzzing job's: LLVM plus vcpkg plus the
# exact pinned ubuntu:26.04 ffmpeg build, building the plain linux-llvm preset.
# The ffmpeg pin matters as much here as anywhere else in this repo - an oracle
# whose behaviour drifts under the gate it backs is not an oracle - and more
# than usual, since several of this corpus's floors were calibrated against
# that exact build.
name: Interop

on:
  schedule:
    # 04:43 UTC. Off the hour, and away from fuzz.yml's 03:17, so two scheduled
    # workflows do not contend for the same runner-queue instant.
    - cron: '43 4 * * *'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/checks/verify_fate_interop.py'
      - 'tools/checks/compare_wav.py'
      - 'tools/checks/verify_dash_schema.py'
      - '.github/workflows/interop.yml'
      # The manifests verify_dash_schema.py holds against the ISO/IEC 23009-1
      # schema: the DASH writer and its header.
      - 'libs/containers/src/mp4/dash.cpp'
      - 'libs/containers/include/iclforge/containers/mp4/dash.hpp'
      # The decode path this gate drives. libs/ac3/src/decoder/ carries the
      # framing (split_frames/split_access_units), the AC-3 FrameDecoder and
      # the Annex E substream reader alike, so one pattern covers every layer
      # the corpus reaches; decode.cpp is the entry point the script invokes.
      - 'libs/ac3/src/decoder/**'
      - 'libs/ac3/include/iclforge/ac3/decoder/**'
      - 'apps/forge/cli/src/commands/decode.cpp'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single source of truth for the vcpkg pin below - see
  # docs/ci-self-hosted-runners.md and _toolchain-versions.yml's own header.
  toolchain-versions:
    uses: ./.github/workflows/_toolchain-versions.yml
    permissions:
      contents: read
      actions: read
    secrets:
      ORG_RUNNERS_TOKEN: ${{ secrets.ORG_RUNNERS_TOKEN }}

  fate-interop:
    name: FATE Interop (pinned third-party bitstreams)
    needs: toolchain-versions
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          attempt=1
          until apt-get update -qq && apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config python3 software-properties-common \
            tar unzip wget zip libxml2-utils \
            ffmpeg=7:8.0.1-3ubuntu2
          do
            echo "::warning title=apt-get::attempt $attempt of 3 failed"
            [ "$attempt" -lt 3 ] || exit 1
            attempt=$((attempt + 1))
            sleep 30
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM 21
        run: bash .github/toolchain/03-llvm-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: ${{ needs.toolchain-versions.outputs.vcpkg_commit }}

      - name: Report ffmpeg version
        run: ffmpeg -version | head -1

      - name: Configure
        run: cmake --preset config-linux-llvm

      - name: Build forge
        run: cmake --build --preset build-linux-llvm --target forge -- -k 0

      # Eight samples fetched from a volunteer-run archive, on a job that now
      # runs per pull request rather than nightly. Caching them keeps that from
      # being eight downloads every time - including on a re-run, which
      # previously refetched the lot, since RUNNER_TEMP does not survive a job.
      #
      # Restoring a cache cannot weaken the gate: fetch_sample() re-hashes
      # every file it finds on disk against the pin and refetches on a
      # mismatch, so a truncated or tampered cache entry is repaired, never
      # trusted. The pin is verified on a cache hit exactly as on a fresh
      # download. That is also what makes a restore from an older revision of
      # the script safe: a re-pinned sample no longer matches and is fetched on
      # its own, and every sample that did not change is reused.
      #
      # What the cache must be is COMPLETE, and it used to be neither
      # guaranteed nor repairable. The one key was
      # fate-corpus-<hash of verify_fate_interop.py>, saved whenever it was not
      # an exact hit. A run in an archive outage saved whatever had arrived
      # (on 2026-11-08, 244 KB of the 1.2 MB corpus); every later run on that
      # script hit it exactly, saved nothing, and went back to the archive for
      # the rest - so the cache kept standing in for a corpus it did not hold,
      # until it was evicted and the nightly runs failed with 8 of 8 samples
      # unchecked. Now:
      #
      #   * `verify_fate_interop.py --cache-status` audits the directory against
      #     the pins (deleting anything that fails them) and says how many of the
      #     samples it holds. It runs after the restore and again after the
      #     decode.
      #   * A COMPLETE set is saved, once, as fate-corpus-v2-complete-... - and
      #     only when what was restored was not already complete. A complete
      #     cache is the end state: it is restored, found complete, and left
      #     alone, so a steady state writes nothing and the entry cannot churn.
      #   * An incomplete set is saved, as fate-corpus-v2-partial-..., only when
      #     it holds MORE samples than what was restored, so an outage run
      #     keeps what arrived and a retry builds on it, but a run that learned
      #     nothing does not add an entry.
      #   * A restore takes the newest COMPLETE entry (this revision of the
      #     script's, else any revision's - the pins are re-checked per sample
      #     either way), and only then the newest partial one. A partial entry
      #     can never shadow a complete one, which is what the old single key
      #     got wrong.
      #
      # Entries are immutable and named by run, so a bad one is not stuck: the
      # next run saves a newer one and the newest wins. All of them together are
      # about 1.2 MB, the actions cache is capped at 10 GB for the whole
      # repository, and GitHub drops the least recently used entries first: the
      # nightly run reads this one daily, which keeps it recent, and if it is
      # evicted regardless the next run that reaches the archive rebuilds it.
      #
      # Restored and saved as separate steps (the same action's /restore and
      # /save, at the same pinned commit) because the one-step form saves only
      # when the whole job succeeds. An archive outage fails the job, so nothing
      # fetched before it was ever kept. A cache is readable from the default
      # branch and from the branch that made it, not between pull requests, so
      # it is main's nightly run that does the seeding.
      #
      # The samples are excerpts of copyrighted films. They live in the actions
      # cache of a private repository and nowhere else: not in the tree, not an
      # artifact, not a release asset.
      - name: Restore the pinned FATE corpus
        id: fate-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fate-samples
          key: fate-corpus-v2-restore-${{ hashFiles('tools/checks/verify_fate_interop.py') }}
          restore-keys: |
            fate-corpus-v2-complete-${{ hashFiles('tools/checks/verify_fate_interop.py') }}-
            fate-corpus-v2-complete-
            fate-corpus-v2-partial-${{ hashFiles('tools/checks/verify_fate_interop.py') }}-
            fate-corpus-v2-partial-

      - name: Audit the restored FATE corpus
        id: fate-before
        env:
          FATE_CACHE_DIR: ${{ runner.temp }}/fate-samples
        run: python3 tools/checks/verify_fate_interop.py --cache-status >> "$GITHUB_OUTPUT"

      # The corpus lands under RUNNER_TEMP, never in the workspace: these are
      # excerpts of copyrighted films, and nothing should be able to sweep them
      # into a commit or an artifact by accident.
      - name: Decode the pinned FATE corpus and hold it against FFmpeg
        env:
          ICLFORGE_CLI: build/config-linux-llvm/bin/forge
          FATE_CACHE_DIR: ${{ runner.temp }}/fate-samples
          # The archive is volunteer-run and has been down for days, failing
          # every pull request for something none of them changed. A pull
          # request checks what it can fetch or has cached and says what it
          # could not, as a warning; the nightly and manual runs stay strict,
          # so an outage is still seen, once a day, where it can be acted on.
          FATE_TOLERATE_UNREACHABLE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: python3 tools/checks/verify_fate_interop.py

      - name: Audit the FATE corpus to save
        id: fate-after
        if: always()
        env:
          FATE_CACHE_DIR: ${{ runner.temp }}/fate-samples
        run: python3 tools/checks/verify_fate_interop.py --cache-status >> "$GITHUB_OUTPUT"

      - name: Save the complete FATE corpus
        if: always() && steps.fate-after.outputs.complete == 'true' && steps.fate-before.outputs.complete != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fate-samples
          key: fate-corpus-v2-complete-${{ hashFiles('tools/checks/verify_fate_interop.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the partial FATE corpus
        if: always() && steps.fate-after.outputs.complete != 'true' && steps.fate-after.outputs.have != '0' && steps.fate-after.outputs.have != steps.fate-before.outputs.have
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fate-samples
          key: fate-corpus-v2-partial-${{ hashFiles('tools/checks/verify_fate_interop.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # The DASH half of the same question. forge fmp4's manifests used to be
      # read back through FFmpeg's dash demuxer and nothing else, and that
      # demuxer takes what it needs and ignores the rest. This holds them
      # against the schema ISO/IEC 23009-1 publishes (MPEGGroup/DASHSchema, at
      # a pinned commit, fetched rather than committed - see the script's
      # header), and fails if its validator accepts a manifest it was
      # corrupted to reject. xmllint is libxml2's, from libxml2-utils above.
      - name: Hold forge's DASH manifests against the ISO/IEC 23009-1 schema
        env:
          ICLFORGE_CLI: build/config-linux-llvm/bin/forge
          DASH_SCHEMA_CACHE_DIR: ${{ runner.temp }}/dash-schema
        run: python3 tools/checks/verify_dash_schema.py --require

      # Saved even when a step above failed, so the packages vcpkg had already
      # built survive for the next attempt (actions/cache's own post-job save
      # runs only on success). continue-on-error: a cache that cannot be saved
      # must never be what fails the job. See .github/actions/save-vcpkg-cache.
      - name: Save vcpkg caches
        if: always()
        continue-on-error: true
        uses: ./.github/actions/save-vcpkg-cache
